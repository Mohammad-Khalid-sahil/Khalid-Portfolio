<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <meta name="theme-color" content="#0b0e14" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #131a22;
        --text: #f5f7fb;
        --muted: #a8b3c7;
        --accent: #67e8f9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #111827, var(--bg));
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
      }
      .card {
        max-width: 420px;
        width: min(90vw, 420px);
        background: rgba(19, 26, 34, 0.9);
        border: 1px solid rgba(103, 232, 249, 0.18);
        border-radius: 20px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      }
      h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 4vw, 2.5rem); }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      .badge {
        display: inline-flex;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        background: rgba(103, 232, 249, 0.12);
        border: 1px solid rgba(103, 232, 249, 0.2);
        color: var(--accent);
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Offline</div>
      <h1>You are offline</h1>
      <p>The portfolio shell is available, but the live API and latest content require a connection. Please reconnect to continue browsing.</p>
    </main>
  </body>
</html>
