<!doctype html><html><head><meta charset="utf-8"><title>Theme audit bootstrap</title></head><body><script>
const params = new URLSearchParams(location.search);
const theme = params.get("theme") || "dark";
localStorage.setItem("portfolio-ui-settings", JSON.stringify({ state: { theme, language: "en" }, version: 0 }));
if (params.get("admin") === "1") localStorage.setItem("portfolio-admin-session", JSON.stringify({ state: { accessToken: "visual-audit-token", user: null }, version: 0 }));
else localStorage.removeItem("portfolio-admin-session");
location.replace(params.get("path") || "/");
</script></body></html>
