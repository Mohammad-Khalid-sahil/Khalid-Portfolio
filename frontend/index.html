<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("portfolio-ui-settings") || "null");
        const mode = saved?.state?.theme || "system";
        const language = ["en", "fa", "ps"].includes(saved?.state?.language) ? saved.state.language : "en";
        document.documentElement.lang = language;
        document.documentElement.dir = language === "fa" || language === "ps" ? "rtl" : "ltr";
        document.documentElement.dataset.theme = mode === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : mode;
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
